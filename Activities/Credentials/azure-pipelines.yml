trigger:
  batch: true
  branches:
    include:
    - develop
    - masters/Credentials
    - release/Credentials/*
    - support/Credentials/*
  paths:
    include:
    - Activities/Credentials/*
    - Activities/Activities.Credentials.sln
    - Activities/Directory.build.targets
    - Activities/Shared/*
    - Activities/Tools/*

pr:
  branches:
    include:
    - develop
    - masters/Credentials
    - release/Credentials/*
    - support/Credentials/*
  paths:
    include:
    - Activities/Credentials/*
    - Activities/Activities.Credentials.sln
    - Activities/Directory.build.targets
    - Activities/Shared/*
    - Activities/Tools/*

variables:
  - template: ..\.pipelines\variables\variables.yml

stages:
  - template: ..\.pipelines\templates\stage.start.yml
    parameters:
      projectName: 'Credentials'
      solutionPath: '$(SolutionsPath)/Activities.Credentials.sln'
      sdkBuild: false
      hasQaPackages: false
      preTestRun:
      - task: UseDotNet@2
        displayName: 'Install .NET 6 SDK'
        inputs:
          packageType: 'sdk'
          version: '6.0.x'

